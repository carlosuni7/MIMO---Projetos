<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body {
            width: 100%;
            height: 100vh;
            color: #000;
            overflow: hidden;
        }

        .container-flex{
            display: flex;
            flex-wrap: wrap;

            border: 1px solid red;
            gap: 8px;
        }
        .card{
            border:1px solid #303030;

            flex-basis: 300px; /* COMPRIMENTO INICIAL DO ITEM*/
            flex-shrink: 1; /*quanto um item irá encolher em relação aos demais itens flexíveis.*/
            flex-grow: 1;  /*quanto um item flexível crescerá em relação aos demais itens flexíveis.*/
        }

        .c5 {
            flex-grow: 1;
        }
    </style>
    <title>Document</title>
  </head>
  <body>

    <div class="container-flex">
      <div class="card">
        <h3>Produto 1</h3>
        <p>Descrição curta aqui.</p>
      </div>
      <div class="card">
        <h3>Produto 2</h3>
        <p>Descrição curta aqui.</p>
      </div>
      <div class="card">
        <h3>Produto 3</h3>
        <p>Descrição curta aqui.</p>
      </div>
      <div class="card">
        <h3>Produto 4</h3>
        <p>Descrição curta aqui.</p>
      </div>
      <div class="card c5">
        <h3>Produto 5</h3>
        <p>Descrição curta aqui.</p>
      </div>
      <div class="card">
        <h3>Produto 6</h3>
        <p>Descrição curta aqui.</p>
      </div>
    </div>
  </body>
</html>
