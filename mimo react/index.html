<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <title>Document</title>

    <style type="text/tailwindcss">
        @theme {


            --primary: #252746;
            --secondary: #4A4D85;
            --

            --text: "Inter", sans-serif;
        }

    </style>
</head>

<body class="text-white text-(--text)">
    <div id="root"></div>

    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- React e react Dom precisa estar sempre na mesma versão -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>


    <script type="text/babel">

        const fontVariant = {
            default: 'text-base',
            muted: 'text-2xl'

        }

        function Header({children, className, ...props}) {
            return (
                <>
                    <header className="min-w-full bg-[var(--primary)] border-b-2 border-solid border-[var(--secondary)] py-3
                    px-[4%] flex flex-row 
                    ">
                    {children}
                    </header>
                </>
            )
        }

        function Text({as,
        variant = 'default',
        className, children,
        ...props}) {

            return React.createElement(
                    as,
                    {
                        className: ` ${fontVariant[variant]} ${className ? className : ''}`,
                        ...props
                    },
                    children
                )
        }

        function App () {
            return (
                <div className="main bg-color main">

                    <Header>
                        <div className="flex-1">

                        </div>
                        <nav className="flex-1">
                            <ul>
                                <li><Text as="a" variant="default" href="#" >Learn</Text></li>
                                <li><Text as="a" variant="default" href="#" >Practice</Text></li>
                                <li><Text as="a" variant="default" href="#" >Build</Text></li>
                                <li><Text as="a" variant="default" href="#" >Library</Text></li>
                                <li><Text as="a" variant="default" href="#" >Live Sessions</Text></li>
                                <li><Text as="a" variant="default" href="#" >LeaderBoard</Text></li>
                                
                            </ul>
                        </nav>
                        <div className="flex-1">
                            <Text as="span" variant="default" className="py-1 px-2 border-2 rounded-lg border-[var(--secondary)] font-medium w-fit">99 coin</Text>
                            <Text as="span" variant="default" className="py-1 px-2 border-2 rounded-lg border-[var(--secondary)] font-medium w-fit">5 days</Text>   
                        
                        </div>
                    </Header>
                    <div>Loading</div>
                </div>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <App />
        )

    </script>

    
</body>

</html>
