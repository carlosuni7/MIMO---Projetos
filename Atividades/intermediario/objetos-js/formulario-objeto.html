<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario com Objeto</title>

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-size: 20px;
        }

        body {
            height: 100vh;
            width: 100%;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .container {
            width: 300px;
            margin: auto;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
            gap: 20px;

            & div {
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
        }

        .content {
            margin: auto;
            margin-top: 30px;
        }

        button {
            width: fit-content;
            padding: 6px 12px;
        }
    </style>
</head>

<body>

    <main>

        <div class="container">
            <div class="nome">
                <label for="nome">Nome: </label>
                <input type="text" id="inNome" name="nome">
            </div>

            <div class="profissao">
                <label for="profissao">Profissão: </label>
                <input type="text" id="inProfissao" name="profissao">
            </div>

            <div class="">
                <label for="tech">Tecnologias</label>
                <input type="text" id="inTech" name="tech">
            </div>
            <button id="btnForm">Enviar</button>
            <button id="btnExibir">Exibir Devs</button>
        </div>
        <div class="content">  
        <ul id="listUl">

        </ul>
</div>

    </main>

    <script src="formulario-objeto.js"></script>
    <script src="objeto.js"></script>

</body>

</html>
