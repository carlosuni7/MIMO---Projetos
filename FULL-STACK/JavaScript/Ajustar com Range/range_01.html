<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="range_01.css">
</head>

<body>
    <main class="main">
        <h1>FlexBox Dashboard</h1>
        <p>Choose where to group flex items</p>

        <button id="inicio">Inicio</button>
        <button id="fim">Fim</button>

        <input id="tamanho" type="range" min="0" max="500" step="5" value="250">
        <p id="valor">250</p>

        <div id="container" class="container">
            <div class="item">1</div>
            <div class="item">2</div>
            <div class="item">3</div>
        </div>
    </main>

    <script src="range_01.js"></script>
</body>

</html>
